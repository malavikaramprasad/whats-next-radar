<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What's Next</title>
<link rel="icon" href="icons/32.png">
<link rel="stylesheet" href="dashboard.css">
</head>
<body>
<main>
  <header>
    <div>
      <h1>What's Next</h1>
      <p class="sub" id="sub">Loading…</p>
    </div>
    <div class="actions">
      <button class="btn" id="refresh">Refresh</button>
      <button class="btn ghost" id="settingsBtn" aria-expanded="false">Settings</button>
    </div>
  </header>

  <form class="settings" id="settings" hidden>
    <label>Goodreads profile link or name
      <input id="profile" type="text" placeholder="goodreads.com/yourname" autocomplete="off">
    </label>
    <label>Shelf
      <input id="shelf" type="text" placeholder="to-read" autocomplete="off">
    </label>
    <button class="btn" type="submit">Save</button>
    <p class="muted small">Your Goodreads profile must be public. Books are read from Goodreads' shelf widget; Kindle details from Amazon.com's Kindle store, in this browser.</p>
  </form>

  <div class="status" id="status" hidden role="status"></div>

  <input class="search" id="q" type="search" placeholder="Search title or author" aria-label="Search books">
  <div class="filters" role="group" aria-label="Filter">
    <button data-f="all" aria-pressed="true">All</button>
    <button data-f="yes" aria-pressed="false">Free on KU</button>
    <button data-f="no" aria-pressed="false">Paid</button>
    <button data-f="other" aria-pressed="false">Not found / not checked</button>
  </div>
  <ul id="list"></ul>
  <footer class="muted small">
    Kindle details are re-checked once a week, one book every few seconds. Prices are Amazon.com's at the time of the check.
  </footer>
</main>
<script src="lib.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
