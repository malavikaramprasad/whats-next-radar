<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What's Next</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E">
<style>
:root {
  --bg: #faf8f5; --card: #ffffff; --ink: #1f1d1a; --muted: #6b665e; --line: #e8e3da;
  --accent: #8a4b2a; --ku: #1d7a46; --ku-bg: #e3f3ea; --no: #9a3b3b; --no-bg: #f7e6e6;
  --unk-bg: #f1eee8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151412; --card: #1f1d1a; --ink: #f1ede6; --muted: #a39d93; --line: #34312c;
    --accent: #e0a27e; --ku: #6fd49b; --ku-bg: #173526; --no: #f09a9a; --no-bg: #3a1f1f;
    --unk-bg: #2a2723;
  }
}
:root[data-theme="dark"] {
  --bg: #151412; --card: #1f1d1a; --ink: #f1ede6; --muted: #a39d93; --line: #34312c;
  --accent: #e0a27e; --ku: #6fd49b; --ku-bg: #173526; --no: #f09a9a; --no-bg: #3a1f1f;
  --unk-bg: #2a2723;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
h1 { font-size: 1.6rem; margin: 0 0 4px; }
.sub { color: var(--muted); margin: 0 0 20px; font-size: .9rem; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.filters button {
  border: 1px solid var(--line); background: var(--card); color: var(--ink);
  padding: 6px 12px; border-radius: 999px; font: inherit; font-size: .9rem; cursor: pointer;
}
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.search {
  width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--card); color: var(--ink); font: inherit; margin-bottom: 12px;
}
ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
li {
  display: grid; grid-template-columns: 56px 1fr; gap: 14px; align-items: start;
  background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
li img, .nocover { width: 56px; height: 84px; object-fit: cover; border-radius: 4px; background: var(--unk-bg); }
.title { font-weight: 600; margin: 0; overflow-wrap: anywhere; }
.title a { color: inherit; text-decoration: none; }
.title a:hover { text-decoration: underline; }
.author { color: var(--muted); margin: 2px 0 10px; font-size: .9rem; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.badge { font-size: .8rem; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--unk-bg); color: var(--muted); }
.badge.yes { background: var(--ku-bg); color: var(--ku); }
.badge.no { background: var(--no-bg); color: var(--no); }
.row a.check { color: var(--accent); font-size: .88rem; font-weight: 600; text-decoration: none; }
.row a.check:hover { text-decoration: underline; }
.mark { border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 8px; padding: 3px 9px; font: inherit; font-size: .82rem; cursor: pointer; }
.mark:hover { border-color: var(--muted); }
.empty { color: var(--muted); text-align: center; padding: 32px 0; }
footer { margin-top: 28px; color: var(--muted); font-size: .82rem; }
</style>
</head>
<body>
<main>
  <h1>What's Next</h1>
  <p class="sub" id="sub">Loading your Goodreads to-read shelf…</p>

  <input class="search" id="q" type="search" placeholder="Search title or author" aria-label="Search books">
  <div class="filters" role="group" aria-label="Filter by Kindle Unlimited status">
    <button data-f="all" aria-pressed="true">All</button>
    <button data-f="yes" aria-pressed="false">In Kindle Unlimited</button>
    <button data-f="unknown" aria-pressed="false">Not checked</button>
    <button data-f="no" aria-pressed="false">Not in KU</button>
  </div>
  <ul id="list"></ul>
  <footer>
    Books refresh daily from Goodreads. Kindle Unlimited marks are saved in this browser.
    <a href="#" id="export">Copy marks</a> · <a href="#" id="import">Paste marks</a>
  </footer>
</main>
<script>
const KEY = "whats-next-ku-v1";
let data = { books: [] }, filter = "all", query = "", repoMarks = {};

function loadMarks() {
  let local = {};
  try { local = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
  return { ...repoMarks, ...local };
}
function saveMark(id, value) {
  let local = {};
  try { local = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
  if (value === null) delete local[id]; else local[id] = value;
  try { localStorage.setItem(KEY, JSON.stringify(local)); } catch (e) {}
}
function amazonUrl(b) {
  const store = data.amazon_store || "www.amazon.com";
  const q = encodeURIComponent(`${b.search_title} ${b.author}`);
  return `https://${store}/s?k=${q}&i=digital-text`;
}
function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "on") for (const [ev, fn] of Object.entries(v)) n.addEventListener(ev, fn);
    else if (v !== null && v !== undefined) n.setAttribute(k, v);
  }
  for (const k of kids) n.append(k);
  return n;
}
function render() {
  const marks = loadMarks();
  const list = document.getElementById("list");
  list.replaceChildren();
  const q = query.toLowerCase();
  const shown = data.books.filter(b => {
    const s = marks[b.id] || "unknown";
    if (filter !== "all" && s !== filter) return false;
    return !q || `${b.title} ${b.author}`.toLowerCase().includes(q);
  });
  for (const b of shown) {
    const s = marks[b.id] || "unknown";
    const badge = el("span", { class: "badge " + (s === "unknown" ? "" : s) },
      s === "yes" ? "✓ Kindle Unlimited" : s === "no" ? "Not in KU" : "KU not checked");
    const buttons = s === "unknown"
      ? [el("button", { class: "mark", on: { click: () => { saveMark(b.id, "yes"); render(); } } }, "It's in KU"),
         el("button", { class: "mark", on: { click: () => { saveMark(b.id, "no"); render(); } } }, "Not in KU")]
      : [el("button", { class: "mark", on: { click: () => { saveMark(b.id, null); render(); } } }, "Undo")];
    list.append(el("li", {},
      b.cover ? el("img", { src: b.cover, alt: "", loading: "lazy" }) : el("div", { class: "nocover" }),
      el("div", {},
        el("p", { class: "title" }, el("a", { href: b.goodreads_url, target: "_blank", rel: "noopener" }, b.title)),
        el("p", { class: "author" }, b.author),
        el("div", { class: "row" }, badge,
          el("a", { class: "check", href: amazonUrl(b), target: "_blank", rel: "noopener" }, "Check on Amazon ↗"),
          ...buttons))));
  }
  if (!shown.length) list.append(el("li", { class: "empty", style: "display:block" }, "No books match."));
  const yes = data.books.filter(b => marks[b.id] === "yes").length;
  const unk = data.books.filter(b => !marks[b.id]).length;
  const when = data.fetched_at ? new Date(data.fetched_at).toLocaleDateString(undefined, { month: "short", day: "numeric" }) : "";
  document.getElementById("sub").textContent =
    `${data.books.length} books to read · ${yes} in Kindle Unlimited · ${unk} not checked yet` + (when ? ` · updated ${when}` : "");
}

document.querySelectorAll(".filters button").forEach(btn => btn.addEventListener("click", () => {
  filter = btn.dataset.f;
  document.querySelectorAll(".filters button").forEach(b => b.setAttribute("aria-pressed", b === btn));
  render();
}));
document.getElementById("q").addEventListener("input", e => { query = e.target.value; render(); });
document.getElementById("export").addEventListener("click", async e => {
  e.preventDefault();
  const text = JSON.stringify(loadMarks());
  try { await navigator.clipboard.writeText(text); alert("Marks copied. Paste them on your other device."); }
  catch (err) { prompt("Copy these marks:", text); }
});
document.getElementById("import").addEventListener("click", e => {
  e.preventDefault();
  const text = prompt("Paste marks copied from another device:");
  if (!text) return;
  try {
    const incoming = JSON.parse(text);
    for (const [id, v] of Object.entries(incoming)) if (v === "yes" || v === "no") saveMark(id, v);
    render();
  } catch (err) { alert("That didn't look like copied marks."); }
});

Promise.all([
  fetch("data/books.json", { cache: "no-store" }).then(r => r.json()),
  fetch("data/ku.json", { cache: "no-store" }).then(r => r.ok ? r.json() : {}).catch(() => ({})),
]).then(([books, ku]) => { data = books; repoMarks = ku; render(); })
  .catch(() => { document.getElementById("sub").textContent = "Couldn't load books.json. Run scripts/fetch_shelf.py first."; });
</script>
</body>
</html>
