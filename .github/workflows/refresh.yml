name: Refresh shelf and deploy

on:
  schedule:
    - cron: "17 11 * * *"   # daily
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Goodreads shelf
        run: python3 scripts/fetch_shelf.py
      - name: Commit updated books
        run: |
          if ! git diff --quiet -- data/books.json; then
            # Ignore runs where only the timestamp changed
            if git diff -U0 -- data/books.json | grep '^[-+] ' | grep -vq '"fetched_at"'; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -am "Refresh Goodreads shelf"
              git push
            fi
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
